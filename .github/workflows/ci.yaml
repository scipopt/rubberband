name: Run Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure sysctl limits
        run: sudo sysctl -w vm.max_map_count=262144
      # Building and starting the stack that ships with the repository doubles
      # as a test of it: the compose healthchecks only pass once Elasticsearch
      # is up and Rubberband answers on its port.
      - name: Start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait
      - name: Run linter and formatter
        run: |
          docker compose exec -T rubberband ruff check rubberband
          docker compose exec -T rubberband ruff check tests
      - name: Build documentation
        run: docker compose exec -T --workdir /app/doc rubberband make doc
      - name: Run tests
        run: docker compose exec -T rubberband ./runtests
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
